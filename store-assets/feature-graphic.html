<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Packbound feature graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #241E45;
    font-family: 'Inter', sans-serif;
  }
  .wrap {
    position: relative;
    width: 1024px;
    height: 500px;
    display: flex;
    align-items: center;
    padding: 0 72px;
  }
  .glow {
    position: absolute;
    right: -140px;
    top: -140px;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,81,86,0.30), transparent 70%);
  }
  .mark {
    flex-shrink: 0;
    margin-right: 56px;
  }
  .mark svg { width: 220px; height: 220px; }
  .copy { position: relative; }
  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 64px;
    color: #F6F4FF;
    letter-spacing: -0.02em;
  }
  .tagline {
    margin-top: 18px;
    font-size: 26px;
    color: #D7D2F2;
    max-width: 560px;
    line-height: 1.35;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="mark">
      <svg viewBox="0 0 300 300"><rect x="0" y="0" width="300" height="300" rx="64" fill="#241E45"/><g transform="translate(12.8,53.4)"><path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z" fill="#241E45" transform="scale(7.7)"/><g transform="scale(6.6)"><path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z" fill="#17BEBB"/><circle cx="12" cy="9" r="4.3" fill="#FFFFFF"/><circle cx="12" cy="9" r="2.3" fill="#0F7C79"/></g></g><g transform="translate(128.8,53.4)"><path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z" fill="#241E45" transform="scale(7.7)"/><g transform="scale(6.6)"><path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z" fill="#FFC145"/><circle cx="12" cy="9" r="4.3" fill="#FFFFFF"/><circle cx="12" cy="9" r="2.3" fill="#A67E2D"/></g></g><g transform="translate(54,72)"><g transform="scale(8.0)"><path d="M12 21s-8-7.5-8-13a8 8 0 1 1 16 0c0 5.5-8 13-8 13z" fill="#E65156"/><circle cx="12" cy="9" r="4.3" fill="#FFFFFF"/><circle cx="12" cy="9" r="2.3" fill="#A63A3E"/></g></g></svg>
    </div>
    <div class="copy">
      <div class="wordmark">packbound</div>
      <div class="tagline">Live location for your whole travel pack - never lost, never tracked forever.</div>
    </div>
  </div>
</body>
</html>
